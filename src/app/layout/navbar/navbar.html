<nav class="sticky top-0 z-50 border-b border-border/70 bg-background/90 backdrop-blur-md">
  <div class="container mx-auto flex items-center justify-between gap-4 px-4 py-3 md:py-4">
    <a routerLink="/" class="shrink-0" aria-label="Home Expand">
      <img src="brand/logo.svg" alt="Home Expand" class="brand-logo" width="128" height="38" />
    </a>

    <ul class="hidden items-center gap-4 md:flex lg:gap-7 xl:gap-9">
      @for (link of links; track link.href) {
        <li>
          <a [href]="link.href" class="nav-link-item">{{ link.label }}</a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2 sm:gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-title hover:bg-surface hover:text-primary"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon
          [src]="theme.isDark() ? 'icons/outline/sun.svg' : 'icons/outline/moon.svg'"
          svgClass="h-5 w-5"
        />
      </button>

      <a [href]="whatsappLink" class="btn-primary hidden sm:inline-flex" target="_blank" rel="noopener noreferrer">
        Book a visit
      </a>

      <button
        type="button"
        class="inline-flex items-center justify-center rounded-md p-1 text-title md:hidden"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-navigation"
      >
        <app-icon
          [src]="isMobileMenuOpen() ? 'icons/outline/x.svg' : 'icons/outline/menu.svg'"
          svgClass="h-7 w-7"
        />
      </button>
    </div>
  </div>

  @if (isMobileMenuOpen()) {
    <div
      id="mobile-navigation"
      class="space-y-4 border-t border-border px-4 pb-5 pt-4 md:hidden"
    >
      <ul class="flex flex-col gap-1 rounded-2xl border border-border bg-surface/80 px-3 py-3">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="block rounded-xl px-3 py-3 text-sm font-semibold uppercase tracking-[0.14em] text-title hover:bg-background hover:text-primary"
              (click)="closeMobileMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a
        [href]="whatsappLink"
        class="btn-primary w-full"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMobileMenu()"
      >
        Book a visit
      </a>
    </div>
  }
</nav>
