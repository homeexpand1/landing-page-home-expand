<section id="why-us" class="scroll-mt-24 bg-surface">
  <div class="container mx-auto grid items-center gap-12 px-4 py-16 md:grid-cols-12 md:py-24">
    <div class="md:col-span-5">
      <app-section-header
        label="Why choose us"
        title="A smaller home should still host well"
        lead="We design for the Friday gathering and the Monday commute through the same dining room."
      />
      <ul class="mt-8 flex flex-col gap-3 text-sm text-muted-foreground">
        <li class="flex items-center gap-2">
          <app-icon src="icons/outline/check.svg" svgClass="h-4 w-4 text-primary" />
          Professional installation on every order
        </li>
        <li class="flex items-center gap-2">
          <app-icon src="icons/outline/check.svg" svgClass="h-4 w-4 text-primary" />
          Delivery across Egypt
        </li>
        <li class="flex items-center gap-2">
          <app-icon src="icons/outline/check.svg" svgClass="h-4 w-4 text-primary" />
          Two-year cover on mechanism, frame, and finish
        </li>
      </ul>
    </div>

    <div class="grid gap-4 md:col-span-7 sm:grid-cols-2">
      @for (benefit of benefits; track benefit.title) {
        <article class="rounded-2xl border border-border bg-card/40 p-6">
          <h3 class="font-display text-lg font-semibold text-title">{{ benefit.title }}</h3>
          <p class="mt-2 text-sm font-light leading-relaxed text-muted-foreground">
            {{ benefit.body }}
          </p>
        </article>
      }
    </div>
  </div>
</section>
