<section class="relative">
  <div class="container mx-auto px-4 py-16 md:py-24 lg:py-28">
    <div class="mx-auto max-w-3xl text-center">
      <p class="section-label">Smart Furniture &amp; Home Décor</p>
      <h1 class="section-title mt-3">Built for smaller spaces, bigger lives</h1>
      <p class="section-lead mx-auto">
        Transformer furniture designed and made for Egyptian homes. Expand your dining room without
        giving up the space you live in every day.
      </p>
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <a
          [href]="whatsappLink"
          class="btn-primary"
          target="_blank"
          rel="noopener noreferrer"
        >
          Book a showroom visit
        </a>
        <a href="#how-it-works" class="btn-outline">How it works</a>
      </div>
      <p
        class="mt-6 flex items-center justify-center gap-2 text-xs font-semibold uppercase tracking-[0.16em] text-muted-foreground"
      >
        <app-icon src="icons/outline/check.svg" svgClass="h-4 w-4 text-primary" />
        Est. 2025 · New Cairo showroom
      </p>
    </div>
  </div>
</section>
